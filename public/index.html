<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kun COM">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <title>Kun COM VH — Département Communication</title>

  <style>
    /* Reset Complete & Mobile Layout */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #1C1C1E;
      overflow: hidden;
    }

    /* DESKTOP / TABLET WRAPPER */
    .desktop-bg-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1C1C1E 0%, #000000 100%);
    }

    /* DEVICE CONTAINER FRAME */
    .app-device-frame {
      width: 100%;
      height: 100%;
      max-width: 460px;
      max-height: 940px;
      background-color: #F2F2F7;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Adaptations Ordinateur & Tablette */
    @media (min-width: 501px) {
      .app-device-frame {
        border-radius: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 10px #2C2C2E;
        height: 92vh;
      }
    }

    /* APP ROOT CONTAINER */
    #root {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="desktop-bg-wrapper">
    <div class="app-device-frame">
      <!-- LE COMPOSANT RACINE REACT SE REND ICI -->
      <div id="root">
        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; background:#F2F2F7; font-family:sans-serif;">
          <div style="font-size:32px; margin-bottom:10px;">📱</div>
          <h2 style="font-size:18px; font-weight:800; color:#007AFF;">Kun COM VH</h2>
          <p style="font-size:12px; color:#8E8E93; margin-top:4px;">Chargement de l'application...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT BUNDLE FRONTEND REACT / PWA -->
  <script src="app.js"></script>

  <!-- REGISTRATION SERVICE WORKER PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) { console.log('✅ PWA Service Worker Enregistré :', reg.scope); })
          .catch(function(err) { console.log('❌ Erreur Service Worker :', err); });
      });
    }
  </script>
</body>
</html>
