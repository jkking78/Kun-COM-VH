<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kun COM">
  <meta name="description" content="Kun COM VH — Réseau social interne du Département Communication, Église Vase d'Honneur">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <title>Kun COM — Département Communication VH</title>

  <style>
    /* ============================
       RESET GLOBAL
       ============================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============================
       BASE HTML & BODY
       ============================ */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      /* NE PAS mettre overflow:hidden ici — bloque le scroll des formulaires auth */
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1C1C1E;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================
       WRAPPER DESKTOP/TABLETTE
       ============================ */
    .desktop-bg-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at 30% 50%, #1A1A2E 0%, #000000 100%);
      overflow: hidden;
    }

    /* ============================
       CADRE DEVICE (iPhone mockup sur desktop)
       ============================ */
    .app-device-frame {
      width: 100%;
      height: 100%;
      max-width: 460px;
      max-height: 940px;
      background-color: #F2F2F7;
      position: relative;
      overflow: hidden;   /* clipping uniquement sur ce conteneur */
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 501px) {
      .app-device-frame {
        border-radius: 40px;
        box-shadow:
          0 0 0 10px #2C2C2E,
          0 24px 60px rgba(0, 0, 0, 0.7);
        height: 92vh;
      }
    }

    /* ============================
       ROOT — Le conteneur React / JS monte ici
       ============================ */
    #root {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;    /* overflow géré en interne par JS */
      position: relative;
    }

    /* ============================
       LOADER INITIAL (remplacé dès que JS s'exécute)
       ============================ */
    #initialLoader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: #F2F2F7;
      gap: 14px;
    }

    .loader-logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #007AFF, #0055CC);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .loader-title {
      font-size: 20px;
      font-weight: 900;
      color: #000000;
      letter-spacing: -0.5px;
    }

    .loader-subtitle {
      font-size: 12px;
      color: #8E8E93;
      margin-top: -8px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35); }
      50% { transform: scale(1.06); box-shadow: 0 12px 32px rgba(0, 122, 255, 0.5); }
    }

    /* ============================
       ANIMATIONS GLOBALES
       ============================ */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0);    }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0);      }
    }

    /* Scrollbar invisible sur webkit */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>
<body>

  <div class="desktop-bg-wrapper">
    <div class="app-device-frame">
      <!-- L'application JS se rend ici -->
      <div id="root">
        <!-- LOADER INITIAL : remplacé immédiatement par app.js -->
        <div id="initialLoader">
          <div class="loader-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <p class="loader-title">Kun COM</p>
          <p class="loader-subtitle">Chargement de l'application...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SUPABASE SDK (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- BUNDLE PRINCIPAL (PWA Vanilla JS) -->
  <script src="app.js?v=19"></script>

  <!-- DÉBLOCAGE ANTI-SPINNER (Garantie de déblocage 0ms / 400ms max) -->
  <script>
    (function() {
      // Déblocage immédiat si le loader est toujours présent
      function forceUnlock() {
        var loader = document.getElementById('initialLoader');
        if (loader && window.App) {
          try { window.App.tab('home'); } catch(e) {}
        }
      }
      setTimeout(forceUnlock, 400);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('✅ PWA Service Worker:', reg.scope);
            reg.update();
          })
          .catch(function(err) {
            console.warn('Service Worker non enregistré:', err);
          });
      });
    }
  </script>

</body>
</html>
