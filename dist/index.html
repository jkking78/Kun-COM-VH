<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kun COM">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <title>Kun COM VH — Département Communication</title>

  <style>
    /* Reset & Clean iOS Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #E5E5EA;
      color: #1C1C1E;
      overflow: hidden;
    }

    /* DESKTOP / TABLET : Conteneur centré au format iPhone */
    .desktop-bg-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top left, #1C1C1E, #000000);
      background-attachment: fixed;
    }

    .app-device-frame {
      width: 100%;
      height: 100%;
      max-width: 440px;
      max-height: 920px;
      background-color: #F2F2F7;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Sur grand écran : Bordures arrondies et ombre portée iOS */
    @media (min-width: 501px) {
      .app-device-frame {
        border-radius: 44px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 12px #2C2C2E;
        height: 90vh;
      }
    }

    /* Application Root Container */
    #root {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* PWA Banner d'installation */
    .pwa-install-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 18px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      border: 1px solid rgba(0,122,255,0.2);
    }
    .pwa-install-banner text {
      font-size: 12px;
      font-weight: 700;
      color: #1C1C1E;
    }
    .pwa-install-btn {
      background: #007AFF;
      color: #FFF;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="desktop-bg-wrapper">
    <div class="app-device-frame">
      <div id="root">
        <!-- Rendu dynamique par React / App.web.jsx -->
      </div>
    </div>
  </div>

  <!-- Chargement du Bundle Frontend App Web & PWA -->
  <script src="app.js"></script>

  <!-- Enregistrement du Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ PWA Service Worker Enregistré :', reg.scope))
          .catch(err => console.log('❌ Erreur Service Worker :', err));
      });
    }
  </script>
</body>
</html>
