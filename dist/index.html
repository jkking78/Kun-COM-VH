<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B63F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Commit">
  <meta name="description" content="Commit VH — Réseau social interne du Département Communication, Église Vase d'Honneur">
  <link rel="manifest" href="manifest.json">

  <!-- Ouvre à l'avance les connexions vers la base et le CDN : la négociation
       réseau (DNS + TLS) se fait alors PENDANT le téléchargement de la page, au
       lieu de s'y ajouter. Sur un réseau mobile, cela retire plusieurs centaines
       de millisecondes avant l'affichage des publications. -->
  <link rel="preconnect" href="https://yugkryhikrfsxbuyxacl.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://yugkryhikrfsxbuyxacl.supabase.co">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <!-- Refonte : identité typographique. Bricolage Grotesque (titres),
       Inter (interface), JetBrains Mono (données : heures, notes, compteurs).
       display=swap pour ne jamais bloquer l'affichage ; repli système sinon. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <!-- iOS ignore le manifest pour l'icône d'accueil : il lui faut son propre
       apple-touch-icon, en 180×180, opaque et à bords carrés (iOS applique
       lui-même le masque arrondi). Sans ce fichier, l'écran d'accueil affiche
       une capture floue de la page à la place du logo. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!-- Open Graph / partage externe (aperçu générique — les liens de publication
       individuels utilisent /api/p/:id qui génère une miniature dédiée) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Commit — Département Communication VH">
  <meta property="og:description" content="Commit VH — Réseau social interne du Département Communication, Église Vase d'Honneur">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Commit — Département Communication VH">
  <meta name="twitter:description" content="Commit VH — Réseau social interne du Département Communication, Église Vase d'Honneur">

  <title>Commit — Département Communication VH</title>

  <style>
    /* ============================
       RESET GLOBAL
       ============================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============================
       BASE HTML & BODY
       ============================ */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      /* NE PAS mettre overflow:hidden ici — bloque le scroll des formulaires auth */
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0B0D12;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================
       WRAPPER DESKTOP/TABLETTE
       ============================ */
    .desktop-bg-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at 30% 50%, #1A1A2E 0%, #000000 100%);
      overflow: hidden;
    }

    /* ============================
       CADRE DEVICE (iPhone mockup sur desktop)
       ============================ */
    .app-device-frame {
      width: 100%;
      height: 100%;
      max-width: 460px;
      max-height: 940px;
      /* Blanc (et non #F2F2F7) : cette couleur n'est visible QUE dans la bande
         réservée à la barre d'état ci-dessous, et doit donc s'aligner sur les
         en-têtes de l'app, tous quasi blancs. Le fond gris des écrans est porté
         par les conteneurs internes, il n'est pas affecté. */
      background-color: #FFFFFF;
      position: relative;
      overflow: hidden;   /* clipping uniquement sur ce conteneur */
      display: flex;
      flex-direction: column;
      /* ZONE PROTÉGÉE iOS — installée sur l'écran d'accueil, l'app tourne en
         plein écran (apple-mobile-web-app-capable) : le contenu passe alors SOUS
         la barre d'état (heure, réseau, batterie). Sans cette réserve, l'en-tête
         se retrouve dessous et ses boutons (notifications, +, avatar) deviennent
         impossibles à toucher. Vaut 0 partout ailleurs (navigateur, ordinateur). */
      padding-top: env(safe-area-inset-top);
    }

    /* PIÈGE : env(safe-area-inset-top) ne mesure QUE l'encoche ou la Dynamic
       Island. Sur un iPhone sans encoche, il vaut 0 — alors que la barre d'état
       recouvre malgré tout le contenu, puisque le style black-translucent la rend
       transparente. La réserve était donc nulle sur ces appareils et l'en-tête
       repassait sous l'heure. On impose ici un minimum, uniquement quand l'app
       tourne installée : dans un navigateur, la barre d'état ne nous concerne pas
       et cette marge serait de l'espace perdu. */
    /* Classe réutilisable pour les fenêtres plein écran, soumises au même piège :
       leur bouton de fermeture repasserait sous l'heure sur un iPhone sans encoche. */
    .app-device-frame, .safe-top { padding-top: env(safe-area-inset-top); }

    @media all and (display-mode: standalone) {
      .app-device-frame, .safe-top { padding-top: max(env(safe-area-inset-top), 22px); }
    }
    @media all and (display-mode: fullscreen) {
      .app-device-frame, .safe-top { padding-top: max(env(safe-area-inset-top), 22px); }
    }

    @media (min-width: 501px) {
      .app-device-frame {
        border-radius: 40px;
        box-shadow:
          0 0 0 10px #2C2C2E,
          0 24px 60px rgba(0, 0, 0, 0.7);
        height: 92vh;
      }
    }

    /* ============================
       ROOT — Le conteneur React / JS monte ici
       ============================ */
    #root {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;    /* overflow géré en interne par JS */
      position: relative;
    }

    /* ============================
       LOADER INITIAL (remplacé dès que JS s'exécute)
       ============================ */
    #initialLoader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: #E8ECF2;
      gap: 14px;
    }

    .loader-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #0B63F6;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .loader-title {
      font-size: 20px;
      font-weight: 600;
      color: #0B0D12;
      letter-spacing: -0.3px;
    }

    .loader-subtitle {
      font-size: 12px;
      color: #8A93A0;
      margin-top: -8px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.82; }
    }

    /* ============================
       ANIMATIONS GLOBALES
       ============================ */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0);    }
    }

    /* Secousse de la cloche à l'arrivée d'une notification. On fait pivoter
       l'ICÔNE et non le bouton : le halo et la pastille de compteur restent
       stables, seul le battant bouge — c'est ce qui rend le geste lisible. */
    @keyframes notifShake {
      0%, 100% { transform: rotate(0deg); }
      12%  { transform: rotate(-15deg); }
      26%  { transform: rotate(12deg); }
      40%  { transform: rotate(-9deg); }
      54%  { transform: rotate(7deg); }
      68%  { transform: rotate(-4deg); }
      82%  { transform: rotate(2deg); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0);      }
    }

    /* Scrollbar invisible sur webkit */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
  <!-- CROPPER.JS — chargé À LA DEMANDE (voir chargerCropper dans js/04) et non
       plus ici. Placé dans l'en-tête, il bloquait l'affichage de la page le temps
       d'un aller-retour vers un CDN tiers, alors qu'il ne sert QU'AU recadrage
       d'une photo — jamais à la lecture du fil. -->
</head>
<body>

  <div class="desktop-bg-wrapper">
    <div class="app-device-frame">
      <!-- L'application JS se rend ici -->
      <div id="root">
        <!-- LOADER INITIAL : remplacé immédiatement par les scripts de js/ -->
        <div id="initialLoader">
          <div class="loader-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <p class="loader-title">Commit</p>
          <p class="loader-subtitle">Chargement de l'application...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SUPABASE SDK (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Le SDK s'expose dans window.supabase. Or les scripts de js/ déclarent leur
       propre "var supabase" au niveau global, ce qui écrase cette référence avant
       de pouvoir s'en servir. On met donc le SDK de côté ici, juste après son
       chargement, sous un nom qui ne peut pas entrer en collision. -->
  <script>window.__supabaseSdk = window.supabase;</script>

  <!-- MORPHDOM (CDN) — réconciliation DOM légère : ne patch que ce qui a changé au
       lieu de tout redessiner à chaque rendu (fluidité + stabilité mémoire) -->
  <script src="https://cdn.jsdelivr.net/npm/morphdom@2/dist/morphdom-umd.min.js"></script>

  <!-- BUNDLE PRINCIPAL (PWA Vanilla JS) — anciennement un seul fichier app.js,
       désormais découpé en modules thématiques (même code, chargés dans l'ordre
       d'origine, aucun changement de comportement) pour faciliter la maintenance. -->
  <script src="js/01-core.js?v=139"></script>
  <script src="js/02-media.js?v=139"></script>
  <script src="js/03-render-engine.js?v=139"></script>
  <script src="js/04-render-auth-cropper.js?v=139"></script>
  <script src="js/05-render-feed.js?v=139"></script>
  <script src="js/06-render-panels.js?v=139"></script>
  <script src="js/07-app-controller.js?v=139"></script>
  <script src="js/08-bootstrap.js?v=139"></script>

  <!-- DÉBLOCAGE ANTI-SPINNER (Garantie de déblocage 0ms / 400ms max) -->
  <script>
    (function() {
      // Déblocage immédiat si le loader est toujours présent
      function forceUnlock() {
        var loader = document.getElementById('initialLoader');
        if (loader && window.App) {
          try { window.App.tab('home'); } catch(e) {}
        }
      }
      setTimeout(forceUnlock, 400);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('✅ PWA Service Worker:', reg.scope);
            reg.update();
          })
          .catch(function(err) {
            console.warn('Service Worker non enregistré:', err);
          });
      });
    }
  </script>

</body>
</html>
